buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        google()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "com.android.tools.build:gradle:$androidPluginVersion"
        classpath "com.mobidevelop.robovm:robovm-gradle-plugin:$robovmVersion"
    }
}

subprojects {
    version = projectVersion
    ext {
        appName = 'DiamondStory'
        // Assets live in android/assets (a separate, git-ignored repository); every platform reads them from there.
        assetsDir = rootProject.file('android/assets')
    }

    repositories {
        mavenCentral()
        google()
    }
}

// RoboVM (iOS) only understands Java 8 bytecode, so every JVM module targets Java 8.
configure(subprojects.findAll { it.name != 'android' }) {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 8
        options.compilerArgs += '-Xlint:-options'
    }
}
