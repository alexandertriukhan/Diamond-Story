apply plugin: 'application'

sourceSets.main.java.srcDirs = ['src/']
// Packs the assets into the runnable jar; `run` reads them straight from assetsDir.
sourceSets.main.resources.srcDirs = [assetsDir]
sourceSets.main.resources.exclude('src/**', '**/*.tpproj', '.git/**')

application.mainClass = 'com.alextriukhan.match3.desktop.DesktopLauncher'

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"

    // Newer LWJGL avoids native-access warnings on recent JDKs.
    constraints {
        implementation "org.lwjgl:lwjgl:$lwjgl3Version"
        implementation "org.lwjgl:lwjgl-glfw:$lwjgl3Version"
        implementation "org.lwjgl:lwjgl-jemalloc:$lwjgl3Version"
        implementation "org.lwjgl:lwjgl-openal:$lwjgl3Version"
        implementation "org.lwjgl:lwjgl-opengl:$lwjgl3Version"
        implementation "org.lwjgl:lwjgl-stb:$lwjgl3Version"
    }
}

def isMac = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('mac')

tasks.named('run', JavaExec) {
    workingDir = assetsDir
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    // GLFW on macOS must run on the main thread.
    if (isMac) jvmArgs '-XstartOnFirstThread'
}

tasks.named('jar', Jar) {
    archiveFileName = "${appName}-${projectVersion}.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
    manifest {
        attributes 'Main-Class': application.mainClass, 'Enable-Native-Access': 'ALL-UNNAMED', 'Multi-Release': 'true'
    }
}
