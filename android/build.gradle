apply plugin: 'com.android.application'

android {
    namespace = 'com.alextriukhan.match3'
    compileSdk = 36

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.setSrcDirs(['src'])
            res.setSrcDirs(['res'])
            assets.setSrcDirs(['assets'])
            jniLibs.setSrcDirs(['libs'])
        }
    }
    androidResources {
        // Default aapt ignore list plus the asset repo's working files (.xcf sources, TexturePacker project).
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~:<dir>src:!*.tpproj'
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/robovm/ios/robovm.xml', 'META-INF/DEPENDENCIES.txt', 'META-INF/DEPENDENCIES',
                         'META-INF/dependencies.txt', '**/*.gwt.xml']
            pickFirsts += ['META-INF/LICENSE.txt', 'META-INF/LICENSE', 'META-INF/license.txt', 'META-INF/LGPL2.1',
                           'META-INF/NOTICE.txt', 'META-INF/NOTICE', 'META-INF/notice.txt']
        }
    }
    defaultConfig {
        applicationId = 'com.alextriukhan.match3'
        minSdk = 21
        targetSdk = 36
        versionCode = 1
        versionName = projectVersion
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled = true
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

configurations { natives }

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:$androidDesugaringVersion"
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
}

// Extracts the .so files from the natives jars into libs/<abi>/ so they get packed into the APK.
tasks.register('copyAndroidNatives') {
    doFirst {
        configurations.natives.copy().files.each { jar ->
            def abi = ['armeabi-v7a', 'arm64-v8a', 'x86_64', 'x86'].find { jar.name.endsWith("natives-${it}.jar") }
            if (abi != null) {
                copy {
                    from zipTree(jar)
                    into file("libs/$abi")
                    include '*.so'
                }
            }
        }
    }
}

tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach {
    it.dependsOn 'copyAndroidNatives'
}

// Launches the already installed app on a connected device: ./gradlew android:installDebug android:run
tasks.register('run', Exec) {
    def sdkDir = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    def localProperties = rootProject.file('local.properties')
    if (localProperties.exists()) {
        def properties = new Properties()
        localProperties.withInputStream { properties.load(it) }
        sdkDir = properties.getProperty('sdk.dir') ?: sdkDir
    }
    commandLine "$sdkDir/platform-tools/adb", 'shell', 'am', 'start', '-n', 'com.alextriukhan.match3/com.alextriukhan.match3.AndroidLauncher'
}
